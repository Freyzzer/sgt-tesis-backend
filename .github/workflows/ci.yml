name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SGT.Tesis.slnx

      - name: Format
        run: dotnet format SGT.Tesis.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SGT.Tesis.slnx --no-restore -c Release

      - name: Test
        run: dotnet test --solution SGT.Tesis.slnx --no-build -c Release --coverage --coverage-output-format cobertura --results-directory ./TestResults

      - name: Vulnerable packages
        shell: bash
        run: |
          dotnet list SGT.Tesis.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE "^\s+>" vuln.txt; then
            echo "Se encontraron paquetes vulnerables"; exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: TestResults/**/*.cobertura.xml

  # Verifica que las imágenes (API y migraciones) se construyen; no publica nada.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Imagen de migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: false
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max

      - name: Imagen de herramientas de base de datos
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dbtools
          push: false
          cache-from: type=gha,scope=dbtools
          cache-to: type=gha,scope=dbtools,mode=max

  # Busca secretos (claves, contraseñas, tokens) en el historial del repositorio.
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-banner --redact --verbose
