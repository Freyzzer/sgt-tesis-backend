name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SGT.Tesis.slnx

      - name: Format
        run: dotnet format SGT.Tesis.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SGT.Tesis.slnx --no-restore -c Release

      - name: Test
        run: dotnet test --solution SGT.Tesis.slnx --no-build -c Release --coverage --coverage-output-format cobertura --results-directory ./TestResults

      - name: Vulnerable packages
        shell: bash
        run: |
          dotnet list SGT.Tesis.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE "^\s+>" vuln.txt; then
            echo "Se encontraron paquetes vulnerables"; exit 1
          fi

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: TestResults/**/*.cobertura.xml

  # Las mismas pruebas de integración, pero contra un SQL Server real (el job anterior usa SQLite en memoria).
  # Cada prueba crea y elimina su propia base de datos; además se aplican todas las migraciones en una base nueva y
  # se comprueba que el modelo no tenga cambios sin migrar.
  pruebas-sql-server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Contraseña de un contenedor efímero que existe solo durante este job; no protege ningún dato real.
      SA_PASSWORD: Ci-Efimero#2026-Sgt
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Efimero#2026-Sgt
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Efimero#2026-Sgt' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SGT.Tesis.slnx

      - name: Build
        run: dotnet build SGT.Tesis.slnx --no-restore -c Release

      - name: Pruebas de integración contra SQL Server
        env:
          SGT_TEST_SQLSERVER: Server=127.0.0.1,1433;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True;Connect Timeout=30
        run: dotnet test --project tests/SGT.Tesis.IntegrationTests --no-build -c Release

  # Verifica que las imágenes (API y migraciones) se construyen; no publica nada.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Imagen de migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: false
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max

      - name: Imagen de herramientas de base de datos
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dbtools
          push: false
          cache-from: type=gha,scope=dbtools
          cache-to: type=gha,scope=dbtools,mode=max

  # Busca secretos (claves, contraseñas, tokens) en el historial del repositorio.
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-banner --redact --verbose
