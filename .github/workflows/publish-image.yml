name: Publicar imágenes

# Publica las imágenes en GitHub Container Registry cuando se integra a develop (Staging) o main (Producción),
# o al crear una etiqueta de versión (vX.Y.Z). El DESPLIEGUE a cada ambiente depende de la plataforma elegida
# (ver docs/OPERATIONS.md): este flujo solo entrega artefactos versionados y trazables.

on:
  push:
    branches: [develop, main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRO: ghcr.io
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - nombre: api
            target: runtime
            sufijo: ""
          - nombre: migrator
            target: migrator
            sufijo: "-migrator"
          - nombre: dbtools
            target: dbtools
            sufijo: "-dbtools"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRO }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN }}${{ matrix.sufijo }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,scope=${{ matrix.nombre }},mode=max
