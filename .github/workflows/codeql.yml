name: CodeQL

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

# Code scanning exige un repositorio público o GitHub Advanced Security. En un repositorio privado sin esa
# licencia el análisis corre pero el envío de resultados falla ("Code scanning is not enabled"), por eso el job
# solo se ejecuta cuando está disponible. Si la institución activa Advanced Security, quitar la condición `if`.
jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
